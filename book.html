*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--ink);color:var(--bone);font-family:'Manrope',system-ui,sans-serif;font-weight:400;line-height:1.5;display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid var(--line);background:rgba(10,10,10,.85);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
.logo{font-family:'Fraunces',serif;font-style:italic;font-weight:300;font-size:22px;color:var(--bone);text-decoration:none;letter-spacing:-.01em}
.back{color:var(--mute);font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.back:hover{color:var(--oasis)}
.hero{text-align:center;padding:48px 24px 24px;max-width:680px;margin:0 auto}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--oasis);margin-bottom:14px}
h1{font-family:'Fraunces',serif;font-style:italic;font-weight:300;font-size:clamp(30px,5vw,46px);line-height:1.15;letter-spacing:-.01em;margin-bottom:14px}
.hero p{color:var(--mute);font-size:16px;max-width:520px;margin:0 auto}
main{flex:1;display:flex;flex-direction:column}
#cal-embed{flex:1;min-height:680px;width:100%;max-width:1100px;margin:0 auto;padding:8px 16px 32px}
footer{padding:16px 32px;border-top:1px solid var(--line);color:var(--mute);font-size:12px;text-align:center}
footer a{color:var(--mute);text-decoration:none}
footer a:hover{color:var(--oasis)}
@media (max-width:640px){
  header{padding:16px 20px}
  .hero{padding:32px 20px 16px}
  #cal-embed{min-height:760px;padding:4px 8px 24px}
}
