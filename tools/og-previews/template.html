<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OG template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Tajawal:wght@300;400;500;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#000;}
  .og{
    width:1200px; height:630px;
    position:relative; overflow:hidden;
    background-image:url('/assets/og/og-bg.png');
    background-size:cover; background-position:center center; background-repeat:no-repeat;
    font-family:'Manrope',sans-serif;
    color:#F2EFE8;
  }
  .og.ar{
    direction:rtl;
    font-family:'Tajawal','Cairo','Manrope',sans-serif;
  }
  .pad{
    position:absolute; inset:0;
    padding:60px 72px;
    display:flex; flex-direction:column;
    justify-content:space-between;
  }
  .logo{ width:200px; height:auto; display:block; }
  .stack{ max-width:820px; margin-bottom:80px; }
  .og.ar .stack{ max-width:880px; }
  .headline{
    font-family:'Manrope',sans-serif;
    font-weight:700; font-size:99px; line-height:1;
    letter-spacing:-.04em; color:#F2EFE8;
    margin-bottom:22px;
  }
  .og.ar .headline{
    font-family:'Tajawal','Cairo',sans-serif;
    font-weight:700; letter-spacing:-.01em; line-height:1.05;
  }
  .headline.size-md{ font-size:84px; }
  .headline.size-sm{ font-size:68px; }
  .headline.size-xs{ font-size:54px; }
  .sub{
    font-family:'Fraunces',serif;
    font-style:italic; font-weight:400;
    font-variation-settings:"SOFT" 50, "opsz" 72;
    font-size:33px; line-height:1.2;
    letter-spacing:-.01em; color:#00D9C0;
    margin-bottom:22px;
  }
  .og.ar .sub{
    font-family:'Tajawal','Cairo',sans-serif;
    font-style:normal; font-weight:500;
    letter-spacing:0; line-height:1.4;
  }
  .desc{
    font-family:'Manrope',sans-serif;
    font-weight:400; font-size:23px;
    line-height:1.4; letter-spacing:0;
    color:rgba(242,239,232,0.85);
    max-width:780px;
  }
  .og.ar .desc{
    font-family:'Tajawal','Cairo',sans-serif;
    font-weight:400; line-height:1.5;
  }
  .url{
    font-family:'JetBrains Mono',monospace;
    font-size:14px; letter-spacing:.06em;
    color:#F2EFE8;
  }
</style>
</head>
<body>
<div class="og" id="og">
  <div class="pad">
    <img src="logo-wordmark.png" alt="Ensign" class="logo" id="logo">
    <div class="stack">
      <div class="headline" id="headline">Ensign Solutions</div>
      <div class="sub" id="sub">A new intelligence built in Saudi Arabia.</div>
      <div class="desc" id="desc">AI-powered marketing, sales, and business systems built to connect strategy, execution, and intelligence.</div>
    </div>
    <div class="url">ensignksa.com</div>
  </div>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const og = document.getElementById('og');
  const headline = document.getElementById('headline');
  if(p.get('lang')==='ar'){ og.classList.add('ar'); document.documentElement.setAttribute('lang','ar'); document.documentElement.setAttribute('dir','rtl'); }
  if(p.has('h')) headline.textContent = p.get('h');
  if(p.has('s')) document.getElementById('sub').textContent = p.get('s');
  if(p.has('d')) document.getElementById('desc').textContent = p.get('d');

  // auto-size headline by length
  const len = headline.textContent.length;
  headline.classList.remove('size-md','size-sm','size-xs');
  if(len > 28) headline.classList.add('size-xs');
  else if(len > 20) headline.classList.add('size-sm');
  else if(len > 14) headline.classList.add('size-md');
</script>
</body>
</html>
