<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ensign OG — final composite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#000;}
  .og{
    width:1200px;
    height:630px;
    position:relative;
    overflow:hidden;
    background-image:url('/assets/og/og-bg.png');
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
    font-family:'Manrope',sans-serif;
    color:#F2EFE8;
  }
  .pad{
    position:absolute;
    inset:0;
    padding:60px 72px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .logo{
    width:200px;
    height:auto;
    display:block;
  }
  .stack{max-width:820px;}
  .headline{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:99px;
    line-height:1;
    letter-spacing:-.04em;
    color:#F2EFE8;
    margin-bottom:22px;
  }
  .sub{
    font-family:'Manrope',sans-serif;
    font-weight:500;
    font-size:33px;
    line-height:1.18;
    letter-spacing:-.005em;
    color:#00D9C0;
    margin-bottom:22px;
  }
  .desc{
    font-family:'Manrope',sans-serif;
    font-weight:400;
    font-size:23px;
    line-height:1.4;
    letter-spacing:0;
    color:rgba(242,239,232,0.85);
    max-width:780px;
  }
  .url{
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    letter-spacing:.06em;
    color:#F2EFE8;
  }
</style>
</head>
<body>
<div class="og" id="og">
  <div class="pad">
    <!-- top: real Ensign wordmark from brand assets -->
    <img src="logo-wordmark.png" alt="Ensign" class="logo">


    <!-- middle: headline + sub + desc -->
    <div class="stack">
      <div class="headline">Ensign Solutions</div>
      <div class="sub">A new intelligence built in Saudi Arabia.</div>
      <div class="desc">AI-powered marketing, sales, and business systems built to connect strategy, execution, and intelligence.</div>
    </div>

    <!-- bottom: url -->
    <div class="url">ensignksa.com</div>
  </div>
</div>
</body>
</html>
